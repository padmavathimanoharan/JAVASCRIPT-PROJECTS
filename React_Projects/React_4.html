<!DOCTYPE html>
<html>
<!--HEAD-->

<head>
    <meta charset="UTF-8">
    <title>Node.js Assignment</title>
    <script src="react.js"></script>
    <script src="react-dom.js"></script>
    <script src="https://unpkg.com/react@16/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@16/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<!--BODY-->

<body>
    <div id='node'></div>
    <script type="text/babel">
        // “React.Component” is used to specify a class or function.
        class Greeting extends React.Component {
            // The “render()” is used to create a function in React.
            render() {
                return <h1>my-react-app created through cmd prompt successfully</h1>
            }
        }
        ReactDOM.render(<Greeting />, document.getElementById('node'))
    </script>

</body>

</html>
