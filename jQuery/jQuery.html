<!--jQuery.html-->
<!DOCTYPE html>
<html lang="en">

<head>
    <title>JQuery</title>
    <!--Link to the Google API JQuery files -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.0/jquery.min.js"></script>
</head>
<script>
    // wait until the document is loaded before running any jQuery
    $(document).ready(function () {
        // selects the HTML element to append content
        $("html").append(
            // content to be added to the HTML element
            "<body>\
            <div id='container'>\
            <div id='inner'>\
            <h1>Basic jQuery</h1>\
            <p id='1'>Paragraph 1</p>\ <p id='2'>Paragraph 2</p>\ <p id='3'>Paragraph_3</p>\ </div>\
            </div>\
            </body>"
        );
        // Event setup using a convenience method
        $("#1").click(function() {
        console.log("You clicked a paragraph!");
        });
        // using jQuery to add CSS to the HTML element with id='2'
        $("#2").css({ "color": "red" });
        // click function to hide the h1 element when the element with
        // id = '3' is clicked
        $("#3").click(function () {
            $("h1").hide();
        });
        // Toggle the display of h1 over 1.8 seconds
        $("h1").toggle(1800);
    });
</script>

</html>
