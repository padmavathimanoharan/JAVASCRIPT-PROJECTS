<!DOCTYPE html>
<html>

<head>
    <title>Viewport</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/style.css" type="text/css" rel="stylesheet">
    <script src="js/script.js"></script>
</head>

<body>
    <!--How to create a Responsive Text-->
    <h1 id="h1">Responsive Text</h1>

    <p id="p">Resize the browser window to see how the text size scales.</p>

    <p id="p">Use the "vw" unit when sizing the text. 10vw will set the size to 10% of the viewport
        width.</p>

    <p id="p">Viewport is the browser window size. 1vw = 1% of viewport width. If the viewport is 50cm wide, 1vw is 0.5cm.</p>
</body>

</html>
